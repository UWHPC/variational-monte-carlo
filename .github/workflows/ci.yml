name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: fp64
            arguments: ""
          - configuration: fp32
            arguments: --fp32
          - configuration: fp64-fast-math
            arguments: --ffast-math
          - configuration: fp32-fast-math
            arguments: --fp32 --ffast-math

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes software-properties-common
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes g++-15 liblapacke-dev libopenblas-dev ninja-build

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-test-cpu/_deps
          key: ${{ runner.os }}-cpu-tests-${{ matrix.configuration }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Build and run tests
        run: ./scripts/test.sh --cpu ${{ matrix.arguments }}

      - name: Upload test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-tests-${{ matrix.configuration }}-failure-log
          path: build-test-cpu/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  cuda-build:
    name: CUDA compile-only
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes software-properties-common
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes g++-15 liblapacke-dev libopenblas-dev ninja-build

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: 13.3.0
          method: network
          sub-packages: '["compiler", "cudart-dev"]'
          non-cuda-sub-packages: '["libcublas-dev", "libcusolver-dev", "libcurand-dev", "libcusparse-dev", "libnvjitlink-dev"]'

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-ci-cuda/_deps
          key: ${{ runner.os }}-cuda-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure CUDA tests and validation
        run: |
          cmake -S . -B build-ci-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=/usr/bin/g++-15 \
            -DCMAKE_CUDA_COMPILER="$CUDA_PATH/bin/nvcc" \
            -DCMAKE_CUDA_HOST_COMPILER=/usr/bin/g++-15 \
            -DCMAKE_CUDA_ARCHITECTURES=80 \
            -DBUILD_TESTING=ON \
            -DVMC_BUILD_VALIDATION=ON \
            -DVMC_ENABLE_CUDA=ON

      - name: Compile CUDA tests and validation
        run: cmake --build build-ci-cuda --target vmc_tests vmc_validations --parallel 2
